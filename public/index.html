<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Anza College AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #800000;
      --primary-hover: #6a0000;
      --primary-light: #fbf0f0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --user-bubble: #800000;
      --user-text: #ffffff;
      --bot-bubble: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--primary);
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .badge {
      background-color: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .message-row.bot {
      align-items: flex-start;
    }

    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }

    .msg.user {
      background-color: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 3px;
    }

    .msg.bot {
      background-color: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: var(--text-main);
    }

    .msg.bot p {
      margin-bottom: 8px;
    }

    .msg.bot p:last-child {
      margin-bottom: 0;
    }

    .msg.bot ul, .msg.bot ol {
      padding-left: 22px;
      margin: 8px 0;
    }

    .msg.bot li {
      margin-bottom: 4px;
    }

    .msg.bot h3 {
      margin: 16px 0 8px 0;
      color: var(--primary);
      font-size: 1.02rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg.bot h3:first-child {
      margin-top: 0;
    }

    .msg.bot strong {
      font-weight: 600;
      color: #0f172a;
    }

    .msg.bot a {
      color: var(--primary);
      text-decoration: none;
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid rgba(128, 0, 0, 0.15);
      transition: all 0.15s ease;
      display: inline-block;
      margin: 2px 0;
    }

    .msg.bot a:hover {
      background: #f3dada;
      border-color: var(--primary);
      text-decoration: none;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.82rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .footer-container {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.02);
    }

    #input-form {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input-box {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 25vh;
      overflow-y: auto;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #input-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(128, 0, 0, 0.1);
    }

    #send-btn {
      padding: 11px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    #send-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span>De Anza College AI Assistant</span>
      <span class="badge">Official Catalog RAG</span>
    </div>
  </header>

  <div id="chat-container">
    <div class="message-row bot">
      <div class="msg bot">
        <p>Hello! I am the official De Anza College AI Assistant. Ask me anything about course requirements, prerequisites, registration dates, or college policies.</p>
        <div class="quick-chips">
          <button class="chip" onclick="askQuestion('What are the prerequisites for CIS 22A?')">CIS 22A Prerequisites</button>
          <button class="chip" onclick="askQuestion('What math classes are required for Computer Science?')">Math for CS Transfer</button>
          <button class="chip" onclick="askQuestion('What is the grading policy for Pass/No Pass?')">Pass / No Pass Policy</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-container">
    <form id="input-form">
      <textarea 
        id="input-box" 
        rows="1" 
        placeholder="Ask a question (e.g. What are prerequisites for MATH 1A?)..." 
        required
      ></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
    <div class="disclaimer">De Anza AI Assistant answers using official published college catalog & schedule data.</div>
  </div>

  <script src="/app.js?v=7"></script>
</body>
</html>
